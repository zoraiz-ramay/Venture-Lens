# Redis configuration for embedded single-container usage
bind 127.0.0.1
port 6379
protected-mode yes
daemonize no
loglevel notice
logfile ""
databases 4

# Sessions (db 1) have no business on disk. `dir` below is the same directory runs.db
# lives in, which api/store.py syncs wholesale to S3 — snapshotting session state next to
# it is asking for credentials to end up in a bucket. Redis has no other consumer, so
# there is nothing else here worth persisting.
save ""
dir /app/data
maxmemory 128mb

# NOT allkeys-lru. Under memory pressure that would evict live sessions, signing people
# out at random with no error in any log — the hardest possible bug to diagnose. At ~1 KB
# per session against 128 MB the limit should never be approached; if it somehow is, fail
# the write loudly instead.
maxmemory-policy noeviction
