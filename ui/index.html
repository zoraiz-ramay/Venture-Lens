<!doctype html>
<!-- Siemens iX theme. The workspace is a light data canvas, so the schema is pinned to light
     rather than "system": the dark schema would invert the canvas and destroy the Tracxn
     reading experience this UI is built around. The dark product chrome is applied deliberately
     through --chrome-* tokens, not by switching the whole app to a dark schema. -->
<html lang="en" data-ix-theme="classic" data-ix-color-schema="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Startup Evaluation · Siemens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
