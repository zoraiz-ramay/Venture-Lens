# Serves the built SPA and proxies /api + /health to the backend container.
# Security headers set here so they apply to every static response.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: the browser only ever talks to this server; nginx forwards
    # to the api container. Long timeouts because evaluate can take minutes.
    #
    # Use Docker's embedded DNS (127.0.0.11) and put the upstream host in a
    # variable so nginx re-resolves it per request instead of caching the IP at
    # startup — otherwise recreating the api container (new IP) causes 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ ^/(api|health) {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 64k;
    }
}
